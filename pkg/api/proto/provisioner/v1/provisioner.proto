syntax = "proto3";

// Package provisioner.v1 defines the gRPC API for the k8shell provisioner
// service, which manages the full lifecycle of user workspaces including
// provisioning, upgrading, stopping, and deletion.
package provisioner.v1;

option go_package = "github.com/k8shell-io/common/pkg/api/gen/go/provisioner/v1;provisionerv1";

import "common/v1/common.proto";
import "query/v1/query.proto";

// ProvisionerService manages the full lifecycle of user workspaces.
// Clients interact with this service to provision new workspaces
// query workspace state, and tear down workspaces.
service ProvisionerService {
  // GetWorkspaces returns all workspaces matching the given filter criteria.
  rpc GetWorkspaces(GetWorkspacesRequest) returns (GetWorkspacesResponse);

  // FindWorkspace returns the details of a single workspace by name.
  rpc FindWorkspace(FindWorkspaceRequest) returns (common.v1.WorkspaceDetails);

  // GetWorkspacesByUserStr returns workspaces for the given userstr
  rpc GetWorkspacesByUserStr(GetWorkspacesByUserStrRequest) returns (GetWorkspacesResponse);

  // GetWorkspacesQuerySchema returns the query.v1.Descriptor advertising
  // which workspace fields are queryable/sortable via QueryWorkspaces, and
  // which operators are valid on each.
  rpc GetWorkspacesQuerySchema(GetWorkspacesQuerySchemaRequest) returns (query.v1.Descriptor);

  // QueryWorkspaces retrieves workspaces matching a generic query.v1.Payload,
  // as advertised by GetWorkspacesQuerySchema.
  rpc QueryWorkspaces(QueryWorkspacesRequest) returns (GetWorkspacesResponse);

  // GetBlueprints returns every blueprint registered in the provisioner,
  // regardless of user.
  rpc GetBlueprints(GetBlueprintsRequest) returns (GetBlueprintsResponse);

  // ProvisionWorkspaceStream provisions a new workspace and streams progress
  // events back to the caller until the workspace is ready or an error occurs.
  rpc ProvisionWorkspaceStream(ProvisionWorkspaceRequest) returns (stream ProvisionWorkspaceResponse);

  // DeleteWorkspace deprovisions and permanently removes a workspace.
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);

  // DeleteUserWorkspaces hard-deletes every workspace (standalone and
  // injected) owned by a user. Intended as a cleanup step when a user is
  // removed from the system. Deletion runs asynchronously in the background;
  // a call made while a previous deletion for the same user is still running
  // is rejected rather than starting a second, concurrent cleanup.
  rpc DeleteUserWorkspaces(DeleteUserWorkspacesRequest) returns (DeleteUserWorkspacesResponse);

  // StopWorkspace suspends a running workspace without removing its state.
  rpc StopWorkspace(StopWorkspaceRequest) returns (StopWorkspaceResponse);

  // StartWorkspaceStream resumes a previously stopped workspace, recreating
  // its pod from the existing Helm release, and streams progress events back
  // to the caller until the workspace is ready or an error occurs.
  rpc StartWorkspaceStream(StartWorkspaceRequest) returns (stream ProvisionWorkspaceResponse);

  // EjectWorkspace removes a previously injected workspace from a workload
  // and deletes all supporting resources (ConfigMaps, PVCs, NetworkPolicies).
  rpc EjectWorkspace(EjectWorkspaceRequest) returns (EjectWorkspaceResponse);

  // ListInjectNamespaces returns the namespaces the provisioner is configured
  // to allow workspace injection into. It is the first step in building an
  // inject-mode provisioning request: the namespace chosen here becomes the
  // "ns=" of the userstr passed to ProvisionWorkspaceStream.
  rpc ListInjectNamespaces(ListInjectNamespacesRequest) returns (ListInjectNamespacesResponse);

  // ListInjectWorkloads returns the workloads a workspace can be injected
  // into, each reporting whether it already hosts an injected workspace and
  // who owns it. A workload hosts at most one workspace, so an occupied
  // workload must be ejected before anyone else can inject into it.
  rpc ListInjectWorkloads(ListInjectWorkloadsRequest) returns (ListInjectWorkloadsResponse);
}

// FindWorkspaceRequest identifies a single workspace to look up.
message FindWorkspaceRequest {
  // workspace is the unique name of the workspace.
  string workspace = 1;
}

// GetWorkspacesRequest filters the list of workspaces to return.
// All fields are optional; omitting a field disables that filter.
message GetWorkspacesRequest {
  // workspace filters by workspace name (partial match allowed).
  string workspace = 1;
  // usernames filters by the owning user(s); pods matching any listed username are returned.
  repeated string usernames = 2;
  // organization filters by the owning organization.
  string organization = 3;
  // blueprint filters by the blueprint used to create the workspace.
  string blueprint = 4;
  // repo_name filters by the source repository name.
  string repo_name = 5;
  // repo_owner filters by the source repository owner.
  string repo_owner = 6;
  // repo_ref filters by the source repository ref (branch, tag, or commit).
  string repo_ref = 7;
}

message GetWorkspacesByUserStrRequest {
  // userstr is the serialised user context string to filter workspaces by.
  string userstr = 1;
}

// GetWorkspacesResponse contains the list of matching workspaces.
message GetWorkspacesResponse {
  // workspaces holds the details of each matched workspace.
  repeated common.v1.WorkspaceDetails workspaces = 1;
}

// GetWorkspacesQuerySchemaRequest requests the query.v1.Descriptor for the
// workspaces resource. It carries no fields today; left as a message rather
// than google.protobuf.Empty so parameters can be added later without
// changing the RPC signature.
message GetWorkspacesQuerySchemaRequest {}

// QueryWorkspacesRequest carries a generic query against the fields
// advertised by GetWorkspacesQuerySchema.
message QueryWorkspacesRequest {
  query.v1.Payload query = 1;
}

// GetBlueprintsRequest requests every blueprint registered in the provisioner.
message GetBlueprintsRequest {}

// GetBlueprintsResponse contains all blueprints registered in the provisioner.
message GetBlueprintsResponse {
  // blueprints is the list of all registered blueprints.
  repeated common.v1.BlueprintSummary blueprints = 1;
}

// ProvisionWorkspaceRequest initiates provisioning of a new workspace.
message ProvisionWorkspaceRequest {
  // userstr is the serialised user context string used to configure the workspace.
  string userstr = 1;
  // timeout is the maximum number of seconds to wait for provisioning to complete.
  int32 timeout = 2;
  // send_progress controls whether progress in percents are streamed.
  bool send_progress = 3;
  // send_events controls whether Kubernetes object events are included in the stream.
  bool send_events = 4;
}

// ProvisionWorkspaceResponse is a single message in the provisioning stream.
// It carries either the initial handshake or a subsequent provisioning event.
message ProvisionWorkspaceResponse {
  oneof data {
    // handshake is the first message in the stream, confirming the workspace
    // name and job ID assigned to this provisioning run.
    HandshakeResponse handshake = 1;
    // event is a subsequent message carrying a provisioning lifecycle event.
    ProvisionEvent event = 2;
  }
}

// HandshakeResponse is the first message returned in a provisioning 
// stream, confirming the job has been accepted.
message HandshakeResponse {
  // workspace is the name assigned to the workspace being provisioned.
  string workspace = 1;
  // jobid is the unique identifier for this provisioning job.
  string jobid = 2;
  // error is non-empty when the server rejects the request before streaming begins.
  string error = 3;
}

// ProvisionEvent represents a single lifecycle event emitted during
// workspace provisionings.
message ProvisionEvent {
  // type is the event category (e.g. "pod", "deployment", "job").
  string type = 1;
  // timestamp is the RFC 3339 time at which the event occurred.
  string timestamp = 2;
  // object_name is the Kubernetes object name associated with this event.
  string object_name = 3;
  // status is the observed status of the object (e.g. "Running", "Failed").
  string status = 4;
  // message provides additional human-readable detail about the event.
  string message = 5;
}

// DeleteWorkspaceRequest identifies the workspace to delete.
message DeleteWorkspaceRequest {
  // workspace is the name of the workspace to delete.
  string workspace = 1;
  // delay_seconds defers deletion by the given number of seconds, allowing
  // in-flight operations to complete gracefully. Use 0 for immediate deletion.
  uint32 delay_seconds = 2;
}

// DeleteWorkspaceResponse reports the outcome of the delete operation.
message DeleteWorkspaceResponse {
  // message provides a human-readable description of the result.
  string message = 1;
}

// DeleteUserWorkspacesRequest identifies the user whose workspaces should
// all be hard-deleted.
message DeleteUserWorkspacesRequest {
  // username is the owner whose standalone and injected workspaces will be deleted.
  string username = 1;
}

// DeleteUserWorkspacesResponse reports the outcome of submitting the bulk
// delete request. Deletion happens asynchronously; this response confirms
// what was queued, not that deletion has completed.
message DeleteUserWorkspacesResponse {
  // message provides a human-readable description of the result.
  string message = 1;
  // workspaces lists the names of the workspaces that were found for the
  // user and queued for deletion at the time the request was accepted.
  repeated string workspaces = 2;
}

// StopWorkspaceRequest identifies the workspace to stop.
message StopWorkspaceRequest {
  // workspace is the name of the workspace to stop.
  string workspace = 1;
  // delay_seconds defers the stop by the given number of seconds. Use 0 for
  // an immediate stop.
  uint32 delay_seconds = 2;
}

// StopWorkspaceResponse reports the outcome of the stop operation.
message StopWorkspaceResponse {
  // message provides a human-readable description of the result.
  string message = 1;
}

// StartWorkspaceRequest identifies the stopped workspace to start.
message StartWorkspaceRequest {
  // workspace is the name of the workspace to start.
  string workspace = 1;
  // timeout is the maximum number of seconds to wait for the pod to become ready.
  int32 timeout = 2;
  // send_progress controls whether progress in percents are streamed.
  bool send_progress = 3;
  // send_events controls whether Kubernetes object events are included in the stream.
  bool send_events = 4;
}

// EjectWorkspaceRequest identifies the workload from which to eject a workspace.
message EjectWorkspaceRequest {
  // userstr identifies the workspace to eject.
  string userstr = 1;
  // namespace is the Kubernetes namespace that contains the target workload.
  string namespace = 2;
  // workload_kind is the Kubernetes resource kind of the target workload (e.g. Deployment, StatefulSet, DaemonSet).
  string workload_kind = 3;
  // workload_name is the name of the target workload to eject from.
  string workload_name = 4;
  // timeout_seconds is how long to wait for the rolling update to settle.
  // Defaults to 60 if unset or 0.
  int32 timeout_seconds = 5;
}

// EjectWorkspaceResponse reports the outcome of the eject operation.
message EjectWorkspaceResponse {
  // workspace is the canonical workspace name that was ejected.
  string workspace = 1;
}

// ListInjectNamespacesRequest requests the injectable namespaces. It carries no
// fields today; left as a message rather than google.protobuf.Empty so
// parameters can be added later without changing the RPC signature.
message ListInjectNamespacesRequest {}

// ListInjectNamespacesResponse lists the namespaces open to injection.
message ListInjectNamespacesResponse {
  // namespaces are the namespaces a workspace may be injected into. Empty
  // means injection is disabled for this provisioner.
  repeated string namespaces = 1;
  // cluster_wide is true when the provisioner is configured to allow injection
  // into every namespace ("*"), in which case namespaces is the set of
  // namespaces that exist in the cluster right now rather than a fixed
  // allow-list, and may include system namespaces.
  bool cluster_wide = 2;
}

// ListInjectWorkloadsRequest selects which workloads to list.
message ListInjectWorkloadsRequest {
  // namespace restricts the listing to a single namespace. It must be one of
  // the namespaces returned by ListInjectNamespaces. Leave empty to list
  // across every injectable namespace.
  string namespace = 1;
  // kinds restricts the listing to the given workload kinds ("deployment",
  // "statefulset", "daemonset"). Empty means all supported kinds.
  repeated string kinds = 2;
}

// InjectWorkload is a workload a workspace can be injected into, together with
// its current injection state.
message InjectWorkload {
  // namespace is the Kubernetes namespace holding the workload.
  string namespace = 1;
  // kind is the workload kind: "deployment", "statefulset", or "daemonset".
  string kind = 2;
  // name is the workload name. Together with namespace and kind it forms the
  // "workload=<kind>/<name>+ns=<namespace>" part of an inject-mode userstr.
  string name = 3;
  // replicas is the workload's desired replica count. Injecting produces one
  // workspace per replica.
  int32 replicas = 4;
  // injected is true when this workload already hosts an injected workspace.
  // A workload holds at most one, so a caller must treat an injected workload
  // as unavailable until it is ejected.
  bool injected = 5;
  // workspace is the canonical id of the workspace currently injected into
  // this workload. Empty unless injected is true.
  string workspace = 6;
  // username is the owner of the currently injected workspace, and
  // organization their tenant. Both are empty unless injected is true; they
  // are what distinguishes a workload the caller may re-enter from one
  // occupied by somebody else.
  string username = 7;
  string organization = 8;
  // blueprint is the blueprint the injected workspace was created from.
  // Empty unless injected is true.
  string blueprint = 9;
  // repo_source is the URL of the repository the workload was built from and
  // repo_revision the revision it was built at, taken verbatim from the
  // workload's "org.opencontainers.image.source" and
  // "org.opencontainers.image.revision" annotations. They describe the
  // workload itself, not any workspace inside it, and so are set whether or
  // not injected is true.
  //
  // The strings are passed through exactly as the workload declares them and
  // are not validated or normalised; a workload declaring neither is still
  // injectable and simply reports these empty.
  string repo_source = 10;
  string repo_revision = 11;
}

// ListInjectWorkloadsResponse lists the injectable workloads found.
message ListInjectWorkloadsResponse {
  // workloads are the matching workloads, ordered by namespace, then kind,
  // then name.
  repeated InjectWorkload workloads = 1;
}
