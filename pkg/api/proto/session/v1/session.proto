syntax = "proto3";

package session.v1;

option go_package = "github.com/k8shell-io/common/pkg/api/gen/go/session/v1;sessionv1";

import "common/v1/common.proto";
import "google/protobuf/empty.proto";
import "query/v1/query.proto";

// SessionService manages SSH session records.
service SessionService {
  // GetSessions returns sessions matching the given filter criteria.
  rpc GetSessions(GetSessionsRequest) returns (Sessions);

  // GetSessionsQuerySchema returns the query.v1.Descriptor advertising which
  // session fields are queryable/sortable via QuerySessions, and which
  // operators are valid on each.
  rpc GetSessionsQuerySchema(GetSessionsQuerySchemaRequest) returns (query.v1.Descriptor);

  // QuerySessions retrieves sessions matching a generic query.v1.Payload, as
  // advertised by GetSessionsQuerySchema.
  rpc QuerySessions(QuerySessionsRequest) returns (Sessions);

  // UpsertSession creates or updates a session record.
  // If a session with the given session_id already exists it is updated,
  // otherwise a new record is created.
  rpc UpsertSession(UpsertSessionRequest) returns (UpsertSessionResponse);

  // EndSession marks a session as ended, recording its final byte counts
  // and end time.
  rpc EndSession(EndSessionRequest) returns (google.protobuf.Empty);

  // GetVersionInfo returns build and version metadata for this service: its
  // released semantic version, the git commit it was built from, and a short
  // description of what the service does.
  rpc GetVersionInfo(common.v1.GetVersionInfoRequest) returns (common.v1.GetVersionInfoResponse);

  // ListSessionRecordings returns metadata for the recordings of a session,
  // ordered by start time, optionally filtered by type and paged. Returns NOT_FOUND when the session does not exist
  // or is not visible under the request's obligations.
  rpc ListSessionRecordings(ListSessionRecordingsRequest) returns (ListSessionRecordingsResponse);

  // GetSessionRecording streams one recording file as stored. The first
  // message is a RecordingMetadata; every following message is a data chunk.
  rpc GetSessionRecording(GetSessionRecordingRequest) returns (stream GetSessionRecordingResponse);
}

// GetSessionsRequest filters the list of sessions to return.
// All fields are optional; omitting a field disables that filter.
message GetSessionsRequest {
  // session_id filters by exact session identifier.
  string session_id = 1;
  // username filters by the owning user.
  string username = 2;
  // workspace filters by the workspace name.
  string workspace = 3;
  // limit caps the number of returned sessions. 0 means no limit.
  int32 limit = 4;
  // offset skips the first N results for pagination.
  int32 offset = 5;
  // reverse returns results in reverse chronological order when true.
  bool reverse = 6;
  // roles filters to sessions owned by a user with at least one of these
  // roles. Empty means unrestricted.
  repeated string roles = 7;
  // org filters to sessions owned by a user in this organization. Empty
  // means unrestricted.
  string org = 8;
  // last_n restricts the result to the N most recently created sessions.
  // 0 means no restriction.
  int32 last_n = 9;
}

// Session represents a single SSH session record.
message Session {
  // session_id is the unique identifier for this session.
  string session_id = 1;
  // username is the user that owns this session.
  string username = 2;
  // k8shelld_ver is the version of k8shelld that handled this session.
  string k8shelld_ver = 3;
  // client is the SSH client identifier string.
  string client = 4;
  // client_ip is the remote IP address of the SSH client.
  string client_ip = 5;
  // start_time is the session start time as a Unix timestamp (seconds).
  int64 start_time = 6;
  // end_time is the session end time as a Unix timestamp (seconds).
  // Zero means the session is still active.
  int64 end_time = 7;
  // workspace is the name of the workspace this session is attached to.
  string workspace = 8;
  // bytes_in is the total number of bytes received from the client.
  int64 bytes_in = 9;
  // bytes_out is the total number of bytes sent to the client.
  int64 bytes_out = 10;
  // operations lists the short operation codes (see models.OperationCode)
  // performed during this session, e.g. shell, pty, port-forward, sftp.
  repeated string operations = 11;
  // blueprint is the blueprint used by the session's workspace.
  string blueprint = 12;
  // updated_at is the time the record was last updated, as a Unix timestamp (seconds).
  int64 updated_at = 13;
  // recordings references the session's recordings other than exec, ordered
  // by start time. Exec recordings (one per command) are not listed here as
  // there can be very many; see exec_recordings. Filled by GetSessions and
  // QuerySessions; ignored on input. Use ListSessionRecordings (optionally
  // filtered by type and paged) for details and GetSessionRecording to
  // download.
  repeated RecordingRef recordings = 14;
  // exec_recordings is the number of exec recordings of the session.
  // Filled by GetSessions and QuerySessions; ignored on input.
  int32 exec_recordings = 15;
}

// RecordingRef identifies one recording of a session and its channel type.
message RecordingRef {
  // recording_id identifies the recording (see RecordingMetadata).
  string recording_id = 1;
  // type is the channel type the recording was made from.
  RecordingType type = 2;
}

// Sessions is a list of session records.
message Sessions {
  repeated Session sessions = 1;
}

// GetSessionsQuerySchemaRequest requests the query.v1.Descriptor for the
// sessions resource. It carries no fields today; left as a message rather
// than google.protobuf.Empty so parameters can be added later without
// changing the RPC signature.
message GetSessionsQuerySchemaRequest {}

// QuerySessionsRequest carries a generic query against the fields advertised
// by GetSessionsQuerySchema.
message QuerySessionsRequest {
  query.v1.Payload query = 1;
}

// UpsertSessionRequest carries the full session record to create or update.
message UpsertSessionRequest {
  // session is the session data to persist.
  Session session = 1;
}

// UpsertSessionResponse carries the persisted session record after upsert.
message UpsertSessionResponse {
  // session is the session as stored, reflecting any server-side defaults.
  Session session = 1;
}

// EndSessionRequest closes an active session and records its final stats.
message EndSessionRequest {
  // session_id identifies the session to end.
  string session_id = 1;
  // end_time is the session end time as a Unix timestamp (seconds).
  int64 end_time = 2;
  // bytes_in is the final total bytes received from the client.
  int64 bytes_in = 3;
  // bytes_out is the final total bytes sent to the client.
  int64 bytes_out = 4;
}

// *** Recording retrieval

// RecordingType is the SSH channel type a recording was made from.
enum RecordingType {
  RECORDING_TYPE_UNSPECIFIED = 0;
  RECORDING_TYPE_SHELL = 1;
  RECORDING_TYPE_EXEC = 2;
  RECORDING_TYPE_TCPIP = 3;
  RECORDING_TYPE_SFTP = 4;
}

// RecordingFormat is the file format a recording is stored in.
enum RecordingFormat {
  RECORDING_FORMAT_UNSPECIFIED = 0;
  // RECORDING_FORMAT_ASCIINEMA is asciinema v2 (.cast).
  RECORDING_FORMAT_ASCIINEMA = 1;
  // RECORDING_FORMAT_PCAPNG is pcap-ng (.pcapng).
  RECORDING_FORMAT_PCAPNG = 2;
}

// RecordingMetadata describes one stored recording.
message RecordingMetadata {
  // recording_id is the server-generated identifier (UUIDv7) of the recording.
  string recording_id = 1;
  // session_id is the SessionService session the recording belongs to.
  string session_id = 2;
  // channel_id is the channel the recording was made from. Empty for TCP/IP
  // recordings, which are shared by all port-forward channels of a session
  // to the same destination.
  string channel_id = 3;
  // type is the channel type.
  RecordingType type = 4;
  // format is the file format.
  RecordingFormat format = 5;
  // gzip is true when the file is stored gzip-compressed.
  bool gzip = 6;
  // size_bytes is the stored file size. Zero while still being written.
  int64 size_bytes = 7;
  // started_at is the recording start time as a Unix timestamp (seconds).
  int64 started_at = 8;
  // ended_at is the recording end time as a Unix timestamp (seconds).
  // Zero means the recording is still being written.
  int64 ended_at = 9;
  // command is the executed command (exec recordings only).
  string command = 10;
  // dst_host is the forwarded destination host (TCP/IP recordings only).
  string dst_host = 11;
  // dst_port is the forwarded destination port (TCP/IP recordings only).
  uint32 dst_port = 12;
}

// ListSessionRecordingsRequest selects the session whose recordings to list.
message ListSessionRecordingsRequest {
  // session_id is the SessionService session ID.
  string session_id = 1;
  // obligations carries the authz obligations from the gateway's policy
  // evaluation (keys "roles", "org", "username", as for session:list) and is
  // enforced as a mandatory scope. Never accepted from end clients.
  map<string, string> obligations = 2;
  // type restricts the result to recordings of this type. Unspecified means
  // all types.
  RecordingType type = 3;
  // limit is the maximum number of recordings to return. 0 selects the
  // server default; larger values are capped.
  int32 limit = 4;
  // offset is the number of matching recordings to skip.
  int32 offset = 5;
}

// ListSessionRecordingsResponse lists a session's recordings by start time.
message ListSessionRecordingsResponse {
  repeated RecordingMetadata recordings = 1;
  // total is the number of recordings matching the request's session and
  // type, regardless of limit and offset.
  int32 total = 2;
}

// GetSessionRecordingRequest selects one recording to download.
message GetSessionRecordingRequest {
  // recording_id identifies the recording.
  string recording_id = 1;
  // offset is the byte offset to start from, for resuming a download.
  int64 offset = 2;
  // obligations carries the authz obligations; see ListSessionRecordingsRequest.
  map<string, string> obligations = 3;
}

// GetSessionRecordingResponse is one message of a recording download stream.
message GetSessionRecordingResponse {
  oneof payload {
    // metadata is always the first message.
    RecordingMetadata metadata = 1;
    // chunk is a block of the stored file, at most 1 MiB.
    bytes chunk = 2;
  }
}

// EndRecordingSessionRequest signals the recording backend to flush and release
// all resources associated with a connection.
message EndRecordingSessionRequest {
  // connection_id identifies the SSH connection whose recording resources should
  // be cleaned up.
  string connection_id = 1;
  // end_time is the session end time as a Unix timestamp (seconds), used to
  // finalise any open recording metadata.
  int64 end_time = 2;
}

// *** Recording

// Direction indicates which side of the channel produced the data.
enum Direction {
  // DIRECTION_OUTPUT is data flowing from the workspace to the client
  // (server stdout / terminal output).
  DIRECTION_OUTPUT = 0;
  // DIRECTION_INPUT is data flowing from the client to the workspace.
  // Only recorded when explicitly enabled.
  DIRECTION_INPUT = 1;
}

// RecordingService accepts client-streaming recording frames from k8shelld
// and persists them for later playback. Each RPC corresponds to a distinct
// SSH channel type with its own typed header and frame set.
service RecordingService {
  // StreamShellRecording records a PTY shell session. The first frame must
  // be a ShellRecordingHeader; subsequent frames carry data chunks or
  // terminal resize events.
  rpc StreamShellRecording(stream ShellRecordingFrame) returns (google.protobuf.Empty);

  // StreamExecRecording records a non-PTY exec channel. The first frame must
  // be an ExecRecordingHeader; subsequent frames carry data chunks.
  rpc StreamExecRecording(stream ExecRecordingFrame) returns (google.protobuf.Empty);

  // StreamTcpipRecording records a direct-tcpip port-forward channel. The
  // first frame must be a TcpipRecordingHeader; subsequent frames carry data chunks.
  rpc StreamTcpipRecording(stream TcpipRecordingFrame) returns (google.protobuf.Empty);

  // StreamSftpRecording records an SFTP subsystem channel. The first frame
  // must be a SftpRecordingHeader; subsequent frames carry data chunks.
  rpc StreamSftpRecording(stream SftpRecordingFrame) returns (google.protobuf.Empty);

  // EndRecordingSession notifies the recording backend that a session has ended
  // and all associated recording resources (open streams, buffers, file handles)
  // should be flushed and released. Must be called once per session_id when the
  // SSH session terminates, regardless of how many recording streams were opened.
  rpc EndRecordingSession(EndRecordingSessionRequest) returns (google.protobuf.Empty);
}

// *** Shared recording types

// DataChunk carries a block of raw channel data with timing information.
message DataChunk {
  // time_offset_ms is the number of milliseconds elapsed since the recording started_at.
  int64 time_offset_ms = 1;
  // data is the raw bytes transferred on the channel.
  bytes data = 2;
  // direction indicates which side produced this data.
  Direction direction = 3;
}

// TerminalResize records a PTY window-change event.
message TerminalResize {
  // time_offset_ms is the number of milliseconds elapsed since the recording started_at.
  int64 time_offset_ms = 1;
  // width is the new terminal width in columns.
  uint32 width = 2;
  // height is the new terminal height in rows.
  uint32 height = 3;
}

// *** Shell recording

// ShellRecordingHeader is the mandatory first frame of a shell recording stream.
message ShellRecordingHeader {
  // session_id is the channel ID: the per-channel identifier the recording
  // client passed to k8shelld (for example "sh-<connId>3" from ssh-proxy).
  // It equals connection_id when the session has a single channel, as for an
  // api-server webshell. Required.
  string session_id = 1;
  // user_token is the token of the user owning the session being recorded.
  string user_token = 2;
  // started_at is the channel start time as a Unix timestamp (seconds).
  int64 started_at = 3;
  // width is the initial terminal width in columns.
  uint32 width = 4;
  // height is the initial terminal height in rows.
  uint32 height = 5;
  // connection_id is the SessionService session ID: the same value the
  // recording client sends as SessionId to UpsertSession and EndSession
  // (one per SSH connection or webshell session). Required.
  string connection_id = 6;
}

// ShellRecordingFrame is a single unit in a shell recording stream.
message ShellRecordingFrame {
  oneof payload {
    // header is the first frame and carries PTY session metadata.
    ShellRecordingHeader header = 1;
    // chunk carries a block of raw terminal data.
    DataChunk chunk = 2;
    // resize carries a terminal window-change event.
    TerminalResize resize = 3;
  }
}

// *** Exec recording

// ExecRecordingHeader is the mandatory first frame of an exec recording stream.
message ExecRecordingHeader {
  // session_id is the channel ID: the per-channel identifier the recording
  // client passed to k8shelld (for example "sh-<connId>3" from ssh-proxy).
  // It equals connection_id when the session has a single channel, as for an
  // api-server webshell. Required.
  string session_id = 1;
  // user_token is the token of the user owning the session being recorded.
  string user_token = 2;
  // started_at is the channel start time as a Unix timestamp (seconds).
  int64 started_at = 3;
  // command is the command that was executed.
  string command = 4;
  // connection_id is the SessionService session ID: the same value the
  // recording client sends as SessionId to UpsertSession and EndSession
  // (one per SSH connection or webshell session). Required.
  string connection_id = 5;
}

// ExecRecordingFrame is a single unit in an exec recording stream.
message ExecRecordingFrame {
  oneof payload {
    // header is the first frame and carries exec session metadata.
    ExecRecordingHeader header = 1;
    // chunk carries a block of raw stdout/stderr data.
    DataChunk chunk = 2;
  }
}

// *** Direct-tcpip recording

// TcpipRecordingHeader is the mandatory first frame of a direct-tcpip recording stream.
message TcpipRecordingHeader {
  // session_id is the channel ID: the per-channel identifier the recording
  // client passed to k8shelld (for example "sh-<connId>3" from ssh-proxy).
  // It equals connection_id when the session has a single channel, as for an
  // api-server webshell. Required.
  string session_id = 1;
  // user_token is the token of the user owning the session being recorded.
  string user_token = 2;
  // started_at is the channel start time as a Unix timestamp (seconds).
  int64 started_at = 3;
  // src_host is the originating host of the port-forward request.
  string src_host = 4;
  // src_port is the originating port of the port-forward request.
  uint32 src_port = 5;
  // dst_host is the destination host of the port-forward request.
  string dst_host = 6;
  // dst_port is the destination port of the port-forward request.
  uint32 dst_port = 7;
  // connection_id is the SessionService session ID: the same value the
  // recording client sends as SessionId to UpsertSession and EndSession
  // (one per SSH connection or webshell session). Required.
  string connection_id = 8;
}

// TcpipRecordingFrame is a single unit in a direct-tcpip recording stream.
message TcpipRecordingFrame {
  oneof payload {
    // header is the first frame and carries port-forward metadata.
    TcpipRecordingHeader header = 1;
    // chunk carries a block of raw forwarded data.
    DataChunk chunk = 2;
  }
}

// *** SFTP recording

// SftpRecordingHeader is the mandatory first frame of an SFTP recording stream.
message SftpRecordingHeader {
  // session_id is the channel ID: the per-channel identifier the recording
  // client passed to k8shelld (for example "sh-<connId>3" from ssh-proxy).
  // It equals connection_id when the session has a single channel, as for an
  // api-server webshell. Required.
  string session_id = 1;
  // user_token is the token of the user owning the session being recorded.
  string user_token = 2;
  // started_at is the channel start time as a Unix timestamp (seconds).
  int64 started_at = 3;
  // connection_id is the SessionService session ID: the same value the
  // recording client sends as SessionId to UpsertSession and EndSession
  // (one per SSH connection or webshell session). Required.
  string connection_id = 4;
}

// SftpRecordingFrame is a single unit in an SFTP recording stream.
message SftpRecordingFrame {
  oneof payload {
    // header is the first frame and carries SFTP session metadata.
    SftpRecordingHeader header = 1;
    // chunk carries a block of raw SFTP protocol data.
    DataChunk chunk = 2;
  }
}

