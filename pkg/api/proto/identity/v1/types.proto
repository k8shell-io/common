syntax = "proto3";

package identity.v1;

option go_package = "github.com/k8shell-io/common/pkg/api/gen/go/identity/v1;identityv1";

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "query/v1/query.proto";

// Username carries a single username identifier.
message Username {
  string username = 1;
}

// UserStr carries a raw user string, which may encode username, organization, or other attributes.
message UserStr {
  string userstr = 1;
}

// Blueprint carries a raw blueprint definition and the address of its source repository.
message Blueprint {
  // blueprint holds the raw blueprint content.
  bytes  blueprint    = 1;
  // repo_address is the URL or address of the repository that owns this blueprint.
  string repo_address = 2;
}

// UserList holds a paginated list of users.
message UserList {
  repeated common.v1.User users = 1;
}

// FindUserRequest looks up a user by username or email. Exactly one of
// username or email should be set.
message FindUserRequest {
  string username = 1;
  string email    = 2;
}

// GetUsersRequest carries pagination parameters, plus optional filters
// sourced from the user:list authz obligations (see pkg/authz/user.go),
// for listing users.
message GetUsersRequest {
  int32 limit  = 1;
  int32 offset = 2;

  // Optional filters applied before limit/offset, as an AND-of-ORs: a user
  // must match every filter field that is set, and a repeated field matches
  // when the user has at least one of the listed values. An unset/empty
  // field imposes no restriction on that dimension.
  repeated string roles      = 3; // user must have at least one of these roles
  repeated string blueprints = 4; // user must have at least one of these blueprints
  string          org        = 5; // user must belong to this organization
}

// GetUsersQuerySchemaRequest requests the query.v1.Descriptor for the users
// resource. It carries no fields today; left as a message rather than
// google.protobuf.Empty so parameters (e.g. org-scoping) can be added later
// without changing the RPC signature.
message GetUsersQuerySchemaRequest {}

// QueryUsersRequest carries a generic query against the fields advertised
// by GetUsersQuerySchema.
message QueryUsersRequest {
  query.v1.Payload query = 1;
}

// GetUsersResponse carries the paginated list of users.
message GetUsersResponse {
  repeated common.v1.User users = 1;
}

// AuthUserPublicKeyRequest carries the credentials for SSH public key authentication.
message AuthUserPublicKeyRequest {
  string username   = 1;
  string public_key = 2;
}

// AuthUserPasswordRequest carries the credentials for password authentication.
// The password is transmitted in plaintext over the (TLS-secured) gRPC channel
// and compared against the bcrypt hash stored for the user; it is never persisted.
message AuthUserPasswordRequest {
  string username = 1;
  string password = 2;
}

// AuthUserResponse carries the result of an authentication attempt.
message AuthUserResponse {
  bool            valid  = 1;
  common.v1.User  user   = 2;

  // locked is true when the account's password auth is temporarily locked
  // out due to repeated failed AuthUserPassword attempts (see identity's
  // password-lockout tracking, keyed by username). Callers should show a
  // generic "account temporarily locked" message rather than "invalid
  // credentials" when this is set, rather than trying to distinguish it
  // from a wrong-password response any other way. Always false for
  // AuthUserPublicKey, which is not subject to password lockout.
  bool            locked = 3;
}

// PasswordLockoutStatus carries a username's current password-lockout state,
// as returned by GetPasswordLockoutStatus.
message PasswordLockoutStatus {
  bool  locked       = 1;
  int64 locked_until = 2; // unix seconds; 0 when not locked
}

// ClearPasswordLockoutResponse carries the result of ClearPasswordLockout.
message ClearPasswordLockoutResponse {
  bool success = 1;
}

// OnboardUserDeviceFlowRequest initiates a device-flow onboarding session for the given provider.
message OnboardUserDeviceFlowRequest {
  string provider     = 1;
  string username     = 2;
}

// OnboardUserWebFlowRequest initiates a web-flow onboarding session for the given provider.
message OnboardUserWebFlowRequest {
  string provider     = 1;
  string redirect_uri = 2;
  string cli_state    = 3;
  bool   create_pat   = 4;
}

// CompleteUserWebFlowRequest carries the OAuth state and authorization code to finalize web-flow onboarding.
message CompleteUserWebFlowRequest {
  string state = 1;
  string code  = 2;
}

// RepoPullRequestRequest identifies a pull request within a repository for a given user.
message RepoPullRequestRequest {
  string username            = 1;
  string repo_owner          = 2;
  string repo_name           = 3;
  int32  pull_request_number = 4;
}

// RepoRefResponse carries the resolved repository reference for a pull request.
message RepoRefResponse {
  string repo_ref = 1;
}

// IdentityProviderInfo carries data about the identity provider
message IdentityProviderInfo {
  string          name         = 1;
  repeated string capabilities = 2;
}

// UserRolesRequest carries a username and one or more roles to add or remove.
message UserRolesRequest {
  string          username = 1;
  repeated string roles    = 2;
}

// Role is a role that may be assigned to users. Roles are flat, opaque name
// strings; any structure in the name (e.g. "<group>-admin") is a policy-level
// convention and is deliberately not modelled here.
message Role {
  string                    name        = 1;  // unique; exact string stored in User.roles
  string                    description = 2;
  string                    org         = 3;  // optional; empty means global
  google.protobuf.Timestamp created_at  = 4;

  // user_count is a computed, read-only field populated by ListRoles — the
  // number of users currently holding this role. Not stored on the role
  // itself and ignored (left zero) by CreateRole/UpdateRole's response.
  int32                     user_count  = 5;

  // blueprints are the blueprint names this role grants. A user's effective
  // blueprint access is the union of blueprints across every role they hold
  // (see AddRoleBlueprints/RemoveRoleBlueprints).
  repeated string           blueprints  = 6;
}

// RoleList holds a list of roles.
message RoleList {
  repeated Role roles = 1;
}

// ListRolesRequest carries the org whose assignable roles are being listed,
// sourced from the role:list authz obligations. The result includes both
// roles scoped to this org and global roles, since a caller assigning roles
// within an org may still assign a global one.
message ListRolesRequest {
  string org = 1;  // required; the organization to list roles for
}

// ListGlobalRolesRequest carries no fields; global roles are not scoped by
// organization. Left as a message rather than google.protobuf.Empty so
// filters can be added later without changing the RPC signature.
message ListGlobalRolesRequest {}

// CreateRoleRequest registers a new assignable role, scoped to org. Global
// roles cannot be created through this RPC — only listed, via
// ListGlobalRoles.
message CreateRoleRequest {
  string name        = 1;
  string description = 2;
  string org         = 3;  // required
}

// UpdateRoleRequest partially updates a role's description. name and org
// together identify the role and are immutable. org is required — global
// roles cannot be updated through this RPC.
message UpdateRoleRequest {
  string                      name        = 1;
  string                      org         = 2;  // required
  google.protobuf.StringValue description = 3;
}

// DeleteRoleRequest identifies the role to remove from the registry. name
// and org together identify the role. org is required — global roles cannot
// be removed through this RPC.
message DeleteRoleRequest {
  string name = 1;
  string org  = 2;  // required
}

// DeleteRoleResponse indicates whether the deletion was successful.
message DeleteRoleResponse {
  bool success = 1;
}

// RoleBlueprintsRequest carries a role name/org and one or more blueprints to
// grant or revoke. name and org together identify the role, matching
// UpdateRoleRequest/DeleteRoleRequest; org is required — global roles are not
// supported here.
message RoleBlueprintsRequest {
  string          name       = 1;
  string          org        = 2;  // required
  repeated string blueprints = 3;
}

// Organization is a named tenant that groups users. Every user belongs to
// exactly one organization (see common.v1.User.organization).
message Organization {
  string                    name        = 1;  // unique
  string                    description = 2;
  google.protobuf.Timestamp created_at  = 3;

  // admin_usernames and user_count are computed fields populated by
  // ListOrganizations — they are not stored on the organization itself and
  // are ignored (left empty/zero) by CreateOrganization's response.
  repeated string admin_usernames = 4;  // users in this org holding the "org-admin" role
  int32           user_count      = 5;  // total number of users in this org

  // read_only is true for the built-in "default" organization only: it
  // cannot be updated or deleted, since it's the fallback organization every
  // k8Shell deployment is seeded with. UpdateOrganization/DeleteOrganization
  // reject any attempt against it with FailedPrecondition. Computed from
  // name, not stored.
  bool read_only = 6;
}

// OrganizationList holds a list of organizations.
message OrganizationList {
  repeated Organization organizations = 1;
}

// ListOrganizationsRequest carries no fields today; organizations are not
// scoped by anything else, unlike roles. Left as a message rather than
// google.protobuf.Empty so filters can be added later without changing the
// RPC signature.
message ListOrganizationsRequest {}

// GetOrganizationRequest identifies a single organization to retrieve by name.
message GetOrganizationRequest {
  string name = 1;
}

// GetOrganizationsQuerySchemaRequest requests the query.v1.Descriptor for
// the organizations resource. It carries no fields today; left as a message
// rather than google.protobuf.Empty so parameters can be added later
// without changing the RPC signature.
message GetOrganizationsQuerySchemaRequest {}

// QueryOrganizationsRequest carries a generic query against the fields
// advertised by GetOrganizationsQuerySchema.
message QueryOrganizationsRequest {
  query.v1.Payload query = 1;
}

// CreateOrganizationRequest registers a new organization.
message CreateOrganizationRequest {
  string name        = 1;
  string description = 2;
}

// UpdateOrganizationRequest partially updates an organization's description.
// Name is immutable and used only to identify the organization.
message UpdateOrganizationRequest {
  string                      name        = 1;
  google.protobuf.StringValue description = 2;
}

// DeleteOrganizationRequest identifies the organization to remove from the registry.
message DeleteOrganizationRequest {
  string name = 1;
}

// DeleteOrganizationResponse indicates whether the deletion was successful.
message DeleteOrganizationResponse {
  bool success = 1;
}

// UserAuthKeysRequest carries a username and one or more SSH public keys to register.
message UserAuthKeysRequest {
  string          username  = 1;
  repeated string auth_keys = 2;
}

// UserAuthKey represents a single SSH public key registered for a user.
message UserAuthKey {
  // key is the SSH public key material.
  string key = 1;
  // source identifies how the key was registered (e.g. "manual", "github").
  string source = 2;
}

// ListUserAuthKeysResponse carries all SSH public keys registered for a user.
message ListUserAuthKeysResponse {
  repeated UserAuthKey auth_keys = 1;
}

// AccessTokenInfo carries access token metadata returned in list responses.
// The raw token and its hash are never included.
message AccessTokenInfo {
  int64                     id             = 1;
  string                    username       = 2;
  string                    name           = 3;
  repeated string           scopes         = 4;
  google.protobuf.Timestamp expires_at     = 5;
  google.protobuf.Timestamp created_at     = 6;
  google.protobuf.Timestamp last_used_at   = 7;
  bool                      is_active      = 8;
  // token_preview holds the first few characters of the token's random portion
  // (after the k8sh_ prefix), letting a user tell their tokens apart without the
  // raw value ever being stored or shown again. Empty for tokens issued before
  // this field existed.
  string                    token_preview  = 9;
}