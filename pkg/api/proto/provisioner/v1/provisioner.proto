syntax = "proto3";

// Package provisioner.v1 defines the gRPC API for the k8shell provisioner
// service, which manages the full lifecycle of user workspaces including
// provisioning, upgrading, stopping, and deletion.
package provisioner.v1;

option go_package = "github.com/k8shell-io/common/pkg/api/gen/go/provisioner/v1;provisionerv1";

import "common/v1/common.proto";
import "query/v1/query.proto";
import "google/protobuf/timestamp.proto";

// ProvisionerService manages the full lifecycle of user workspaces.
// Clients interact with this service to provision new workspaces
// query workspace state, and tear down workspaces.
service ProvisionerService {
  // GetWorkspaces returns all workspaces matching the given filter criteria.
  rpc GetWorkspaces(GetWorkspacesRequest) returns (GetWorkspacesResponse);

  // FindWorkspace returns the details of a single workspace by name.
  rpc FindWorkspace(FindWorkspaceRequest) returns (common.v1.WorkspaceDetails);

  // GetWorkspacesByUserStr returns workspaces for the given userstr
  rpc GetWorkspacesByUserStr(GetWorkspacesByUserStrRequest) returns (GetWorkspacesResponse);

  // GetWorkspacesQuerySchema returns the query.v1.Descriptor advertising
  // which workspace fields are queryable/sortable via QueryWorkspaces, and
  // which operators are valid on each.
  rpc GetWorkspacesQuerySchema(GetWorkspacesQuerySchemaRequest) returns (query.v1.Descriptor);

  // QueryWorkspaces retrieves workspaces matching a generic query.v1.Payload,
  // as advertised by GetWorkspacesQuerySchema.
  rpc QueryWorkspaces(QueryWorkspacesRequest) returns (GetWorkspacesResponse);

  // ListBlueprints returns a summary of every blueprint the provisioner
  // knows about, regardless of user: the file-based global blueprints and
  // every org-scoped database blueprint. Each summary carries its org (empty
  // when global) and is_global flag so a client can filter by organization.
  rpc ListBlueprints(ListBlueprintsRequest) returns (ListBlueprintsResponse);

  // GetBlueprintsQuerySchema returns the query.v1.Descriptor advertising
  // which blueprint fields are queryable/sortable via QueryBlueprints, and
  // which operators are valid on each.
  rpc GetBlueprintsQuerySchema(GetBlueprintsQuerySchemaRequest) returns (query.v1.Descriptor);

  // QueryBlueprints retrieves blueprint summaries matching a generic
  // query.v1.Payload, as advertised by GetBlueprintsQuerySchema. Like
  // ListBlueprints, it is transparent to whether a matched blueprint is
  // file-based or stored in the database.
  rpc QueryBlueprints(QueryBlueprintsRequest) returns (QueryBlueprintsResponse);

  // GetBlueprint returns the full raw (unevaluated) spec of a single
  // blueprint by name. CEL expressions are returned as "!cel:"-prefixed
  // strings rather than evaluated, mirroring k8shelld.v1's GetBlueprint
  // shape. When org is set, an org-scoped database blueprint of that name
  // takes precedence over a file-based blueprint of the same name.
  rpc GetBlueprint(GetBlueprintRequest) returns (GetBlueprintResponse);

  // ValidateBlueprint validates a blueprint YAML document without persisting
  // or registering it, returning every validation problem found. Problems
  // include YAML syntax errors, unknown fields, CEL template errors, and
  // blueprint schema violations, each carrying source line/column
  // information where the underlying validator provides one.
  rpc ValidateBlueprint(ValidateBlueprintRequest) returns (ValidateBlueprintResponse);

  // CreateBlueprint stores a new org-scoped blueprint in the database from
  // the submitted YAML document. name, description and is_template are read
  // from the document itself; org is the only other input. The YAML is
  // validated exactly as ValidateBlueprint does before it is persisted.
  rpc CreateBlueprint(CreateBlueprintRequest) returns (OrgBlueprint);

  // UpdateBlueprint replaces an existing org-scoped blueprint's content with
  // the submitted YAML document, identified by (org, name-from-document).
  // Fails with FAILED_PRECONDITION when name refers to a file-based
  // blueprint, which is read-only. The YAML is validated exactly as
  // ValidateBlueprint does before it is persisted.
  rpc UpdateBlueprint(UpdateBlueprintRequest) returns (OrgBlueprint);

  // DeleteBlueprint removes an org-scoped blueprint from the database. Fails
  // with FAILED_PRECONDITION when name refers to a file-based blueprint,
  // which is read-only.
  rpc DeleteBlueprint(DeleteBlueprintRequest) returns (DeleteBlueprintResponse);

  // ProvisionWorkspaceStream provisions a new workspace and streams progress
  // events back to the caller until the workspace is ready or an error occurs.
  rpc ProvisionWorkspaceStream(ProvisionWorkspaceRequest) returns (stream ProvisionWorkspaceResponse);

  // DeleteWorkspace deprovisions and permanently removes a workspace.
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);

  // DeleteUserWorkspaces hard-deletes every workspace (standalone and
  // injected) owned by a user. Intended as a cleanup step when a user is
  // removed from the system. Deletion runs asynchronously in the background;
  // a call made while a previous deletion for the same user is still running
  // is rejected rather than starting a second, concurrent cleanup.
  rpc DeleteUserWorkspaces(DeleteUserWorkspacesRequest) returns (DeleteUserWorkspacesResponse);

  // StopWorkspace suspends a running workspace without removing its state.
  rpc StopWorkspace(StopWorkspaceRequest) returns (StopWorkspaceResponse);

  // UpdateWorkspaceResources changes the CPU/memory limits and/or the network
  // policy class and egress rules of an existing workspace. The changes are
  // applied directly to the live Kubernetes objects, independently of the
  // workspace's Helm release: the pod is resized in place via the pods/resize
  // subresource and its NetworkPolicies are re-rendered and re-applied. The
  // Helm release is left untouched, so any later operation that re-applies it
  // (a re-provision, or a stop followed by a start) reverts the workspace to
  // the CPU/memory and network settings from its blueprint.
  rpc UpdateWorkspaceResources(UpdateWorkspaceResourcesRequest) returns (UpdateWorkspaceResourcesResponse);

  // StartWorkspaceStream resumes a previously stopped workspace, recreating
  // its pod from the existing Helm release, and streams progress events back
  // to the caller until the workspace is ready or an error occurs.
  rpc StartWorkspaceStream(StartWorkspaceRequest) returns (stream ProvisionWorkspaceResponse);

  // EjectWorkspace removes a previously injected workspace from a workload
  // and deletes all supporting resources (ConfigMaps, PVCs, NetworkPolicies).
  rpc EjectWorkspace(EjectWorkspaceRequest) returns (EjectWorkspaceResponse);

  // ListInjectNamespaces returns the namespaces the provisioner is configured
  // to allow workspace injection into. It is the first step in building an
  // inject-mode provisioning request: the namespace chosen here becomes the
  // "ns=" of the userstr passed to ProvisionWorkspaceStream.
  rpc ListInjectNamespaces(ListInjectNamespacesRequest) returns (ListInjectNamespacesResponse);

  // ListInjectWorkloads returns the workloads a workspace can be injected
  // into, each reporting whether it already hosts an injected workspace and
  // who owns it. A workload hosts at most one workspace, so an occupied
  // workload must be ejected before anyone else can inject into it.
  rpc ListInjectWorkloads(ListInjectWorkloadsRequest) returns (ListInjectWorkloadsResponse);
}

// FindWorkspaceRequest identifies a single workspace to look up.
message FindWorkspaceRequest {
  // workspace is the unique name of the workspace.
  string workspace = 1;
}

// GetWorkspacesRequest filters the list of workspaces to return.
// All fields are optional; omitting a field disables that filter.
message GetWorkspacesRequest {
  // workspace filters by workspace name (partial match allowed).
  string workspace = 1;
  // usernames filters by the owning user(s); pods matching any listed username are returned.
  repeated string usernames = 2;
  // organization filters by the owning organization.
  string organization = 3;
  // blueprint filters by the blueprint used to create the workspace.
  string blueprint = 4;
  // repo_name filters by the source repository name.
  string repo_name = 5;
  // repo_owner filters by the source repository owner.
  string repo_owner = 6;
  // repo_ref filters by the source repository ref (branch, tag, or commit).
  string repo_ref = 7;
}

message GetWorkspacesByUserStrRequest {
  // userstr is the serialised user context string to filter workspaces by.
  string userstr = 1;
}

// GetWorkspacesResponse contains the list of matching workspaces.
message GetWorkspacesResponse {
  // workspaces holds the details of each matched workspace.
  repeated common.v1.WorkspaceDetails workspaces = 1;
}

// GetWorkspacesQuerySchemaRequest requests the query.v1.Descriptor for the
// workspaces resource. It carries no fields today; left as a message rather
// than google.protobuf.Empty so parameters can be added later without
// changing the RPC signature.
message GetWorkspacesQuerySchemaRequest {}

// QueryWorkspacesRequest carries a generic query against the fields
// advertised by GetWorkspacesQuerySchema.
message QueryWorkspacesRequest {
  query.v1.Payload query = 1;
}

// ListBlueprintsRequest requests a summary of every blueprint the
// provisioner knows about.
message ListBlueprintsRequest {}

// ListBlueprintsResponse carries a summary of every blueprint: the
// file-based, global blueprints and every org-scoped database blueprint.
message ListBlueprintsResponse {
  repeated common.v1.BlueprintSummary blueprints = 1;
}

// GetBlueprintsQuerySchemaRequest requests the query.v1.Descriptor for the
// blueprints resource. It carries no fields today; left as a message rather
// than google.protobuf.Empty so parameters can be added later without
// changing the RPC signature.
message GetBlueprintsQuerySchemaRequest {}

// QueryBlueprintsRequest carries a generic query against the fields
// advertised by GetBlueprintsQuerySchema.
message QueryBlueprintsRequest {
  query.v1.Payload query = 1;
}

// QueryBlueprintsResponse contains the list of matching blueprint summaries.
message QueryBlueprintsResponse {
  repeated common.v1.BlueprintSummary blueprints = 1;
}

// GetBlueprintRequest identifies a single blueprint to look up.
message GetBlueprintRequest {
  // name is the unique identifier of the blueprint.
  string name = 1;

  // org optionally scopes the lookup to an organization. When set, an
  // org-scoped database blueprint named `name` in this org is returned in
  // preference to a file-based blueprint of the same name; when empty, only
  // file-based global blueprints are considered.
  string org = 2;
}

// GetBlueprintResponse carries the raw (unevaluated) YAML content of the
// requested blueprint, both fully merged with its inherited Template and as
// defined directly on the blueprint itself. A field present in blueprint but
// absent from own_blueprint is inherited rather than set on this blueprint;
// clients editing a blueprint should only write back fields present in
// own_blueprint (plus whatever the user changed), so unmodified inherited
// values are not pinned onto the child blueprint.
message GetBlueprintResponse {
  bytes blueprint = 1;     // raw blueprint YAML content, merged with Template
  bytes own_blueprint = 2; // raw YAML content defined directly on this blueprint
  string template = 3;     // name of the immediate parent Template, if any
}

// ValidateBlueprintRequest carries a standalone blueprint YAML document to
// validate. It is not registered in the provisioner and does not need to be
// named uniquely. If it references an existing template via `template:`,
// that template's already-registered definition is merged in exactly as it
// would be for a blueprint loaded from disk.
message ValidateBlueprintRequest {
  // yaml is the raw blueprint YAML content: either a bare blueprint document
  // or one wrapped in a top-level `blueprint:` key.
  bytes yaml = 1;
}

// ValidateBlueprintResponse reports every problem found in the submitted
// blueprint.
message ValidateBlueprintResponse {
  // valid is true when errors is empty.
  bool valid = 1;
  // errors lists every validation problem found, if any.
  repeated BlueprintValidationError errors = 2;

  // resolved_blueprint is the raw (unevaluated) content of the submitted
  // document merged with its referenced Template, if any — the same shape
  // GetBlueprintResponse.blueprint returns for an already-registered
  // blueprint, but for this standalone, unregistered document. CEL
  // expressions are returned as "!cel:"-prefixed strings. Only set when
  // valid is true: a caller editing an invalid document should fix the
  // reported errors first rather than being handed a preview built from a
  // broken one. Empty whenever valid is false, for any reason (malformed
  // YAML, an unresolvable template, or a schema/CEL validation failure).
  bytes resolved_blueprint = 3;
}

// BlueprintValidationError describes a single problem found while validating
// a blueprint.
message BlueprintValidationError {
  // line is the 1-indexed source line the error applies to, or 0 when the
  // underlying validator does not report a position (e.g. schema checks that
  // operate on the decoded blueprint rather than the YAML source).
  int32 line = 1;
  // column is the 1-indexed source column the error applies to, or 0 when unknown.
  int32 column = 2;
  // field is the blueprint field the error applies to, if applicable.
  string field = 3;
  // message is a human-readable description of the problem.
  string message = 4;
}

// OrgBlueprint is a blueprint definition stored in the database and scoped
// to a single organization, as opposed to the file-based, global blueprints.
// name and org together identify the blueprint; a blueprint of the same name
// may exist independently per org, and takes precedence over a file-based
// blueprint of that name when a user from this org requests it. Returned by
// CreateBlueprint and UpdateBlueprint.
message OrgBlueprint {
  string name        = 1;
  string org         = 2; // required
  string description = 3;

  // yaml is the raw blueprint YAML content: either a bare blueprint document
  // or one wrapped in a top-level `blueprint:` key, in the same shape
  // ValidateBlueprint/GetBlueprintResponse.blueprint accept/return. If it
  // references an existing file-based Template via `template:`, that
  // template's already-registered definition is merged in exactly as it
  // would be for a blueprint loaded from disk. An org blueprint cannot
  // inherit from another org blueprint, only from a file-based Template.
  bytes yaml = 4;

  bool is_template = 5;

  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// CreateBlueprintRequest registers a new org-scoped blueprint from a YAML
// document. name, description and is_template are read from the document;
// org is the only other input.
message CreateBlueprintRequest {
  string org  = 1; // required
  bytes  yaml = 2; // required: a bare blueprint document or one wrapped in a top-level `blueprint:` key
}

// UpdateBlueprintRequest replaces the content of an existing org-scoped
// blueprint, identified by org plus the name read from the submitted YAML
// document. yaml is replaced wholesale.
message UpdateBlueprintRequest {
  string org  = 1; // required
  bytes  yaml = 2; // required
}

// DeleteBlueprintRequest identifies the org-scoped blueprint to remove, by
// org and name.
message DeleteBlueprintRequest {
  string org  = 1; // required
  string name = 2; // required
}

// DeleteBlueprintResponse indicates whether the deletion was successful.
message DeleteBlueprintResponse {
  bool success = 1;
}

// ProvisionWorkspaceRequest initiates provisioning of a new workspace.
message ProvisionWorkspaceRequest {
  // userstr is the serialised user context string used to configure the workspace.
  string userstr = 1;
  // timeout is the maximum number of seconds to wait for provisioning to complete.
  int32 timeout = 2;
  // send_progress controls whether progress in percents are streamed.
  bool send_progress = 3;
  // send_events controls whether Kubernetes object events are included in the stream.
  bool send_events = 4;
}

// ProvisionWorkspaceResponse is a single message in the provisioning stream.
// It carries either the initial handshake or a subsequent provisioning event.
message ProvisionWorkspaceResponse {
  oneof data {
    // handshake is the first message in the stream, confirming the workspace
    // name and job ID assigned to this provisioning run.
    HandshakeResponse handshake = 1;
    // event is a subsequent message carrying a provisioning lifecycle event.
    ProvisionEvent event = 2;
  }
}

// HandshakeResponse is the first message returned in a provisioning 
// stream, confirming the job has been accepted.
message HandshakeResponse {
  // workspace is the name assigned to the workspace being provisioned.
  string workspace = 1;
  // jobid is the unique identifier for this provisioning job.
  string jobid = 2;
  // error is non-empty when the server rejects the request before streaming begins.
  string error = 3;
}

// ProvisionEvent represents a single lifecycle event emitted during
// workspace provisionings.
message ProvisionEvent {
  // type is the event category (e.g. "pod", "deployment", "job").
  string type = 1;
  // timestamp is the RFC 3339 time at which the event occurred.
  string timestamp = 2;
  // object_name is the Kubernetes object name associated with this event.
  string object_name = 3;
  // status is the observed status of the object (e.g. "Running", "Failed").
  string status = 4;
  // message provides additional human-readable detail about the event.
  string message = 5;
}

// DeleteWorkspaceRequest identifies the workspace to delete.
message DeleteWorkspaceRequest {
  // workspace is the name of the workspace to delete.
  string workspace = 1;
  // delay_seconds defers deletion by the given number of seconds, allowing
  // in-flight operations to complete gracefully. Use 0 for immediate deletion.
  uint32 delay_seconds = 2;
}

// DeleteWorkspaceResponse reports the outcome of the delete operation.
message DeleteWorkspaceResponse {
  // message provides a human-readable description of the result.
  string message = 1;
}

// DeleteUserWorkspacesRequest identifies the user whose workspaces should
// all be hard-deleted.
message DeleteUserWorkspacesRequest {
  // username is the owner whose standalone and injected workspaces will be deleted.
  string username = 1;
}

// DeleteUserWorkspacesResponse reports the outcome of submitting the bulk
// delete request. Deletion happens asynchronously; this response confirms
// what was queued, not that deletion has completed.
message DeleteUserWorkspacesResponse {
  // message provides a human-readable description of the result.
  string message = 1;
  // workspaces lists the names of the workspaces that were found for the
  // user and queued for deletion at the time the request was accepted.
  repeated string workspaces = 2;
}

// StopWorkspaceRequest identifies the workspace to stop.
message StopWorkspaceRequest {
  // workspace is the name of the workspace to stop.
  string workspace = 1;
  // delay_seconds defers the stop by the given number of seconds. Use 0 for
  // an immediate stop.
  uint32 delay_seconds = 2;
}

// StopWorkspaceResponse reports the outcome of the stop operation.
message StopWorkspaceResponse {
  // message provides a human-readable description of the result.
  string message = 1;
}

// WorkspaceResourceLimits carries the desired CPU and memory limits for a
// workspace's main container. An empty field leaves that limit unchanged.
message WorkspaceResourceLimits {
  // cpu is the CPU limit as a Kubernetes resource quantity, e.g. "500m" or "2".
  string cpu = 1;
  // memory is the memory limit as a Kubernetes resource quantity, e.g. "512Mi" or "2Gi".
  string memory = 2;
}

// WorkspacePodSelector is a set of pod labels an egress rule is allowed to
// reach, matching the shorthand entries of a blueprint's
// network.allowEgressToPods list.
message WorkspacePodSelector {
  map<string, string> match_labels = 1;
}

// WorkspaceNetworkRules carries the desired network policy class and egress
// rules for a workspace.
message WorkspaceNetworkRules {
  // network_policy_class selects a predefined network policy class: one of
  // "workspace", "system", "isolated", "user", "organization". Empty leaves
  // the current class unchanged.
  string network_policy_class = 1;
  // replace_egress must be true for allow_egress_to_cidrs and
  // allow_egress_to_pods to take effect. When true they replace the
  // workspace's egress rules wholesale, so passing them empty clears every
  // custom egress rule. When false both fields are ignored and only
  // network_policy_class is considered.
  bool replace_egress = 2;
  // allow_egress_to_cidrs is the set of CIDR ranges the workspace may reach.
  // Applied only when replace_egress is true.
  repeated string allow_egress_to_cidrs = 3;
  // allow_egress_to_pods is the set of pod label selectors the workspace may
  // reach. Applied only when replace_egress is true.
  repeated WorkspacePodSelector allow_egress_to_pods = 4;
}

// UpdateWorkspaceResourcesRequest identifies the workspace to update and
// carries the resource and/or network changes to apply. At least one of
// resources or network must be set.
message UpdateWorkspaceResourcesRequest {
  // workspace is the name of the workspace to update.
  string workspace = 1;
  // resources, when set, changes the workspace's CPU/memory limits.
  WorkspaceResourceLimits resources = 2;
  // network, when set, changes the workspace's network policy class and/or
  // egress rules.
  WorkspaceNetworkRules network = 3;
}

// UpdateWorkspaceResourcesResponse reports the settings in effect after the
// update.
message UpdateWorkspaceResourcesResponse {
  // message is a human-readable summary of what was changed.
  string message = 1;
  // applied_cpu and applied_memory are the workspace's CPU and memory limits
  // after the update.
  string applied_cpu = 2;
  string applied_memory = 3;
  // applied_network_policy_class is the network policy class in effect after
  // the update. Empty when the network was not changed.
  string applied_network_policy_class = 4;
}

// StartWorkspaceRequest identifies the stopped workspace to start.
message StartWorkspaceRequest {
  // workspace is the name of the workspace to start.
  string workspace = 1;
  // timeout is the maximum number of seconds to wait for the pod to become ready.
  int32 timeout = 2;
  // send_progress controls whether progress in percents are streamed.
  bool send_progress = 3;
  // send_events controls whether Kubernetes object events are included in the stream.
  bool send_events = 4;
}

// EjectWorkspaceRequest identifies the workload from which to eject a workspace.
message EjectWorkspaceRequest {
  // userstr identifies the workspace to eject.
  string userstr = 1;
  // namespace is the Kubernetes namespace that contains the target workload.
  string namespace = 2;
  // workload_kind is the Kubernetes resource kind of the target workload (e.g. Deployment, StatefulSet, DaemonSet).
  string workload_kind = 3;
  // workload_name is the name of the target workload to eject from.
  string workload_name = 4;
  // timeout_seconds is how long to wait for the rolling update to settle.
  // Defaults to 60 if unset or 0.
  int32 timeout_seconds = 5;
}

// EjectWorkspaceResponse reports the outcome of the eject operation.
message EjectWorkspaceResponse {
  // workspace is the canonical workspace name that was ejected.
  string workspace = 1;
}

// ListInjectNamespacesRequest requests the injectable namespaces. It carries no
// fields today; left as a message rather than google.protobuf.Empty so
// parameters can be added later without changing the RPC signature.
message ListInjectNamespacesRequest {}

// ListInjectNamespacesResponse lists the namespaces open to injection.
message ListInjectNamespacesResponse {
  // namespaces are the namespaces a workspace may be injected into. Empty
  // means injection is disabled for this provisioner.
  repeated string namespaces = 1;
  // cluster_wide is true when the provisioner is configured to allow injection
  // into every namespace ("*"), in which case namespaces is the set of
  // namespaces that exist in the cluster right now rather than a fixed
  // allow-list, and may include system namespaces.
  bool cluster_wide = 2;
}

// ListInjectWorkloadsRequest selects which workloads to list.
message ListInjectWorkloadsRequest {
  // namespace restricts the listing to a single namespace. It must be one of
  // the namespaces returned by ListInjectNamespaces. Leave empty to list
  // across every injectable namespace.
  string namespace = 1;
  // kinds restricts the listing to the given workload kinds ("deployment",
  // "statefulset", "daemonset"). Empty means all supported kinds.
  repeated string kinds = 2;
}

// InjectWorkload is a workload a workspace can be injected into, together with
// its current injection state.
message InjectWorkload {
  // namespace is the Kubernetes namespace holding the workload.
  string namespace = 1;
  // kind is the workload kind: "deployment", "statefulset", or "daemonset".
  string kind = 2;
  // name is the workload name. Together with namespace and kind it forms the
  // "workload=<kind>/<name>+ns=<namespace>" part of an inject-mode userstr.
  string name = 3;
  // replicas is the workload's desired replica count. Injecting produces one
  // workspace per replica.
  int32 replicas = 4;
  // injected is true when this workload already hosts an injected workspace.
  // A workload holds at most one, so a caller must treat an injected workload
  // as unavailable until it is ejected.
  bool injected = 5;
  // workspace is the canonical id of the workspace currently injected into
  // this workload. Empty unless injected is true.
  string workspace = 6;
  // username is the owner of the currently injected workspace, and
  // organization their tenant. Both are empty unless injected is true; they
  // are what distinguishes a workload the caller may re-enter from one
  // occupied by somebody else.
  string username = 7;
  string organization = 8;
  // blueprint is the blueprint the injected workspace was created from.
  // Empty unless injected is true.
  string blueprint = 9;
  // repo_source is the URL of the repository the workload was built from and
  // repo_revision the revision it was built at, taken verbatim from the
  // workload's "org.opencontainers.image.source" and
  // "org.opencontainers.image.revision" annotations. They describe the
  // workload itself, not any workspace inside it, and so are set whether or
  // not injected is true.
  //
  // The strings are passed through exactly as the workload declares them and
  // are not validated or normalised; a workload declaring neither is still
  // injectable and simply reports these empty.
  string repo_source = 10;
  string repo_revision = 11;
}

// ListInjectWorkloadsResponse lists the injectable workloads found.
message ListInjectWorkloadsResponse {
  // workloads are the matching workloads, ordered by namespace, then kind,
  // then name.
  repeated InjectWorkload workloads = 1;
}
